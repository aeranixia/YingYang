name: Build questionnaire PDF
on:
  push:
    branches: [main]
    paths:
      - 'docs/questionnaire-review-v1.2.0.md'
      - 'scripts/build-questionnaire-pdf.py'
      - '.github/workflows/questionnaire-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install reportlab
      - name: Generate PDF
        run: python scripts/build-questionnaire-pdf.py
      - name: Commit PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/questionnaire-review-v1.2.0.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish downloadable questionnaire PDF"
            git push
          fi
